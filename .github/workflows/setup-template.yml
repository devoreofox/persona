name: Setup From Template
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  rename:
    # is_template is false on a repo generated FROM this template, true on the template
    # repo itself. This keeps the job from ever running against the template source.
    if: github.event.repository.is_template == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if already renamed
        id: guard
        run: |
          if [ ! -f "SamplePlugin/SamplePlugin.csproj" ]; then
            echo "Already renamed, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate plugin name
        if: steps.guard.outputs.skip == 'false'
        run: |
          NAME="${{ github.event.repository.name }}"
          if [[ ! "$NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::Repo name '$NAME' isn't a valid C# identifier (letters/digits/underscore, can't start with a digit, no hyphens or spaces). Rename the repo and re-push, or fix it manually."
            exit 1
          fi

      - name: Rename files and directories
        if: steps.guard.outputs.skip == 'false'
        run: |
          NAME="${{ github.event.repository.name }}"
          git mv SamplePlugin "$NAME"
          git mv "$NAME/SamplePlugin.csproj" "$NAME/$NAME.csproj"
          git mv "$NAME/SamplePlugin.json" "$NAME/$NAME.json"
          git mv SamplePlugin.sln "$NAME.sln"

      # GITHUB_TOKEN can never create, modify, or delete anything under .github/workflows/.
      # That's a hard platform restriction, not something any `permissions:` entry can grant.
      # So this excludes the whole workflows directory (pr-build.yml, release.yml, and this
      # file itself all live there) and just leaves this workflow in place afterward; the
      # guard step above makes every run after the first a no-op.
      - name: Replace SamplePlugin references everywhere
        if: steps.guard.outputs.skip == 'false'
        run: |
          NAME="${{ github.event.repository.name }}"
          find . -type f \
            -not -path './.git/*' \
            -not -path './.github/workflows/*' \
            -not -name '*.png' -not -name '*.dll' -not -name '*.ico' \
            -print0 | xargs -0 sed -i "s/SamplePlugin/$NAME/g"

      - name: Commit and push
        if: steps.guard.outputs.skip == 'false'
        run: |
          NAME="${{ github.event.repository.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename template to $NAME"
          git push origin HEAD:main
